<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor lanzamiento Q4</title>
<link rel="stylesheet" href="../design-system/colors_and_type.css">
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#F8FAFC; }
  .app { display:grid; grid-template-columns:280px 1fr; height:100vh; }
  aside { background:#14142A; color:#fff; padding:22px 16px; overflow:auto; display:flex; flex-direction:column; gap:4px; }
  aside img { height:26px; margin:0 6px 6px; align-self:flex-start; }
  aside .t { font-size:12px; color:rgba(255,255,255,.55); margin:0 6px 16px; line-height:1.4; }
  aside .grp { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#54F4F2; margin:14px 6px 6px; }
  aside button { all:unset; cursor:pointer; padding:9px 12px; border-radius:10px; font-size:14px; color:rgba(255,255,255,.85); display:flex; gap:10px; align-items:center; }
  aside button:hover { background:rgba(255,255,255,.06); }
  aside button.on { background:#8B55FE; color:#fff; }
  aside button small { margin-left:auto; font-size:10.5px; opacity:.6; }
  main { display:flex; flex-direction:column; min-width:0; }
  .bar { display:flex; align-items:center; gap:10px; padding:10px 16px; background:#fff; border-bottom:1px solid #EFF0F6; font-size:13px; }
  .bar b { color:#240C50; }
  .bar .sp { flex:1; }
  .bar a, .bar button { font:600 12.5px var(--font-body); color:#8B55FE; background:#F5F2FF; border:none; border-radius:9999px; padding:7px 12px; cursor:pointer; text-decoration:none; }
  .bar button.on { background:#8B55FE; color:#fff; }
  .view { flex:1; position:relative; overflow:hidden; display:flex; justify-content:center; background:#E9E7F2; }
  iframe { border:0; width:100%; height:100%; background:#fff; transition:width .2s; }
  iframe.m { width:390px; box-shadow:0 10px 40px rgba(20,20,42,.18); }
  .md { flex:1; overflow:auto; background:#fff; }
  .md article { max-width:900px; margin:0 auto; padding:40px 32px 80px; }
  .md h1 { font-size:36px; margin:0 0 16px; }
  .md h2 { font-size:24px; margin:40px 0 12px; padding-top:20px; border-top:1px solid #EFF0F6; }
  .md h3 { font-size:18px; margin:24px 0 8px; }
  .md p, .md li { font-size:15px; line-height:1.65; }
  .md table { border-collapse:collapse; width:100%; font-size:13.5px; margin:12px 0 18px; display:block; overflow-x:auto; }
  .md th { background:#F5F2FF; color:#240C50; text-align:left; }
  .md th, .md td { border:1px solid #E2E2E8; padding:8px 10px; vertical-align:top; }
  .md blockquote { margin:14px 0; padding:10px 16px; border-left:3px solid #8B55FE; background:#F5F2FF; border-radius:0 10px 10px 0; color:#5029A3; }
  .md blockquote p { margin:4px 0; }
  .md code { background:#F0EEEE; padding:1px 6px; border-radius:6px; font-size:13px; }
  .md pre { background:#14142A; color:#DDD4FF; padding:16px; border-radius:12px; overflow-x:auto; font-size:12.5px; }
  .md pre code { background:none; padding:0; }
  .md hr { border:none; border-top:1px solid #EFF0F6; margin:24px 0; }
  .md hr + h2 { border-top:none; padding-top:0; margin-top:8px; }
  @media (max-width:820px) {
    .app { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    aside { flex-direction:row; flex-wrap:wrap; padding:10px; gap:4px; }
    aside img, aside .t, aside .grp { display:none; }
    aside button { padding:7px 10px; font-size:12.5px; }
    aside button small { display:none; }
    .md article { padding:24px 16px 60px; }
    iframe.m { width:100%; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <img src="../design-system/assets/logo/lapzo-logo-on-dark.png" alt="Lapzo">
    <div class="t">Lanzamiento Q4 2026<br>GP · Reclutamiento · Reloj Checador</div>
    <div class="grp">Estrategia</div>
    <button data-f="deck.html">📊 Deck <small>13 slides</small></button>
    <button data-f="estrategia.md">🧭 Estrategia integral</button>
    <button data-f="funnel.html">🔀 Funnel semana a semana</button>
    <button data-f="copys.md">✍️ Copys y artes</button>
    <button data-f="artes/claude-design.md">🎨 Artes: Claude Design</button>
    <div class="grp">Landings</div>
    <button data-f="reloj-checador.html">🕐 Reloj Checador <small>pre</small></button>
    <button data-f="reloj-checador.html?fase=post">🕐 Reloj Checador <small>5-ene</small></button>
    <button data-f="gestion-personal.html">👥 Gestión de Personal</button>
    <button data-f="reclutamiento.html">🎯 Reclutamiento</button>
    <div class="grp">Otros</div>
    <button data-f="README.md">📁 README</button>
  </aside>
  <main>
    <div class="bar">
      <b id="name"></b><span class="sp"></span>
      <button id="dev" class="only-html">📱 Móvil</button>
      <a id="open" target="_blank">Abrir en pestaña ↗</a>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<script src="vendor/marked.min.js"></script>
<script>
  const view = document.getElementById('view'), nm = document.getElementById('name'), op = document.getElementById('open'), dev = document.getElementById('dev');
  let mobile = false;
  async function show(f, btn) {
    document.querySelectorAll('aside button').forEach(b => b.classList.toggle('on', b === btn));
    nm.textContent = btn.textContent.replace(/\s+/g, ' ').trim();
    op.href = f; history.replaceState(null, '', '#' + encodeURIComponent(f));
    view.innerHTML = '';
    if (f.split('?')[0].endsWith('.md')) {
      dev.style.display = 'none';
      const txt = await (await fetch(f)).text();
      const d = document.createElement('div'); d.className = 'md';
      d.innerHTML = '<article>' + (window.marked ? marked.parse(txt) : '<pre>' + txt.replace(/</g, '&lt;') + '</pre>') + '</article>';
      d.querySelectorAll('a[href$=".md"], a[href$=".html"]').forEach(a => a.addEventListener('click', e => {
        const b = document.querySelector(`aside button[data-f="${a.getAttribute('href')}"]`);
        if (b) { e.preventDefault(); show(b.dataset.f, b); }
      }));
      view.appendChild(d);
    } else {
      dev.style.display = '';
      const fr = document.createElement('iframe'); fr.src = f; if (mobile) fr.className = 'm';
      view.appendChild(fr);
    }
  }
  dev.onclick = () => { mobile = !mobile; dev.classList.toggle('on', mobile); const fr = view.querySelector('iframe'); if (fr) fr.classList.toggle('m', mobile); };
  const btns = [...document.querySelectorAll('aside button')];
  btns.forEach(b => b.onclick = () => show(b.dataset.f, b));
  const start = decodeURIComponent(location.hash.slice(1));
  const sb = btns.find(b => b.dataset.f === start) || btns[0];
  show(sb.dataset.f, sb);
</script>
</body>
</html>
