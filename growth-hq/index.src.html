<title>Lapzo Growth HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: fixed dark sidebar (brand rail) + scrolling workspace; summary row on top, detail panels below. Collapses to a top tab strip on phones. */
:root{
  --bg:#F6F5FB; --surface:#FFFFFF; --surface-2:#F1EEFC; --line:#E4E1F0; --line-soft:#EEECF6;
  --fg:#3F3F46; --fg-2:#6B6880; --fg-3:#9A97AE;
  --accent:#8B55FE; --accent-strong:#6E1FE2; --accent-soft:#ECE8FF; --on-accent:#FFFFFF;
  --teal:#04949D; --teal-soft:#DDF7F6;
  --rail:#14142A; --rail-fg:#C9C6E0; --rail-active:#2A2550;
  --good:#00A86B; --good-soft:#DDF7EC; --warn:#C77700; --warn-soft:#FFF1D6; --bad:#D63A72; --bad-soft:#FFE3ED;
  --bar:#8B55FE; --bar-2:#C3B1FF; --grid:#ECEAF4;
  --shadow:0 1px 2px rgba(36,12,80,.06),0 4px 16px rgba(36,12,80,.05);
  --f-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E1C; --surface:#17172B; --surface-2:#1F1D38; --line:#2A2845; --line-soft:#222039;
  --fg:#E8E6F3; --fg-2:#A9A6C2; --fg-3:#76738F;
  --accent:#A685FF; --accent-strong:#C3B1FF; --accent-soft:#2A2350; --on-accent:#14142A;
  --teal:#21DDE0; --teal-soft:#0F3236;
  --rail:#09091A; --rail-fg:#A9A6C2; --rail-active:#221E44;
  --good:#3FE0A4; --good-soft:#0F3326; --warn:#F7C35C; --warn-soft:#3A2C10; --bad:#FF7BA8; --bad-soft:#3D1626;
  --bar:#A685FF; --bar-2:#5B4A99; --grid:#25233D;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E1C; --surface:#17172B; --surface-2:#1F1D38; --line:#2A2845; --line-soft:#222039;
  --fg:#E8E6F3; --fg-2:#A9A6C2; --fg-3:#76738F;
  --accent:#A685FF; --accent-strong:#C3B1FF; --accent-soft:#2A2350; --on-accent:#14142A;
  --teal:#21DDE0; --teal-soft:#0F3236;
  --rail:#09091A; --rail-fg:#A9A6C2; --rail-active:#221E44;
  --good:#3FE0A4; --good-soft:#0F3326; --warn:#F7C35C; --warn-soft:#3A2C10; --bad:#FF7BA8; --bad-soft:#3D1626;
  --bar:#A685FF; --bar-2:#5B4A99; --grid:#25233D;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-fg);padding-block:22px;padding-inline:14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding-inline:8px}
.brand img{width:30px;height:30px}
.brand b{font-family:var(--f-display);font-weight:600;color:#fff;font-size:17px;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;color:var(--rail-fg);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--rail-fg)}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button[aria-current="page"]{background:var(--rail-active);color:#fff}
.nav button[aria-current="page"] svg{stroke:#A685FF}
.nav button:focus-visible{outline:2px solid #A685FF}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-inline:8px;font-size:12px}
.me{display:flex;align-items:center;gap:10px}
.me img{width:30px;height:30px;border-radius:50%}
.me b{color:#fff;font-weight:500;display:block;font-size:13px}
.src-list{display:flex;flex-direction:column;gap:4px}
.src{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg-3);flex:none}
.dot.ok{background:#3FE0A4}.dot.err{background:#FF7BA8}.dot.load{background:#F7C35C}
/* main */
main{min-width:0;padding-block:20px 48px;padding-inline:28px;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:28px;letter-spacing:-.02em;margin:0;line-height:1.15;text-wrap:balance}
.sub{color:var(--fg-2);font-size:13px;margin:2px 0 0}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.pnav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 4px}
.pnav b{font-weight:600;font-size:13px;padding-inline:6px;min-width:150px;text-align:center;font-variant-numeric:tabular-nums}
.icon-btn{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--fg-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn:focus-visible{outline:2px solid var(--accent)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:15px;height:15px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 16px;font-weight:600;font-size:13px;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.btn:hover{background:var(--accent-strong)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--line)}
.btn[disabled]{opacity:.5;pointer-events:none}
/* panels */
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:15px;font-weight:600;margin:0;line-height:1.3}
.panel h3{font-size:13px;font-weight:600;margin:0}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ph p{margin:2px 0 0;color:var(--fg-2);font-size:12.5px}
.meta{font-size:11.5px;color:var(--fg-3)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lbl{font-size:12px;color:var(--fg-2);font-weight:500}
.kpi .val{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--fg)}
.kpi .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--fg-3)}
.kpi.skel .val{color:transparent;background:var(--surface-2);border-radius:6px;width:60%}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.up{background:var(--good-soft);color:var(--good)}
.chip.down{background:var(--bad-soft);color:var(--bad)}
.chip.flat{background:var(--surface-2);color:var(--fg-2)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neutral{background:var(--accent-soft);color:var(--accent-strong)}
.chip.mute{background:var(--surface-2);color:var(--fg-2)}
.pace{height:6px;border-radius:999px;background:var(--surface-2);position:relative;overflow:hidden;margin-top:4px}
.pace i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
.pace u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg-2)}
/* tables */
.tw{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11.5px;font-weight:600;color:var(--fg-2);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.inbar{display:inline-block;height:6px;border-radius:3px;background:var(--bar);vertical-align:middle;margin-left:8px}
/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--fg-3);font-size:10.5px;font-family:var(--f-body)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .b{fill:var(--bar)}
.chart .b.dim{fill:var(--bar-2)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:hover+.b,.chart g:hover .b{fill:var(--accent-strong)}
.tip{position:fixed;pointer-events:none;background:var(--rail);color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;z-index:50;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.funnel{display:flex;flex-direction:column;gap:10px}
.fstep{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 90px;gap:12px;align-items:center}
.fstep .fl{font-size:13px;font-weight:500}
.fstep .fb{height:26px;border-radius:6px;background:var(--surface-2);position:relative}
.fstep .fb i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--bar);min-width:3px}
.fstep .fv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.fconv{font-size:11.5px;color:var(--fg-2);padding-left:calc(min(170px,30%) + 12px)}
/* empty/error */
.empty{border:1px dashed var(--line);border-radius:var(--r-sm);padding:22px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty img{width:72px;height:auto}
.err{background:var(--bad-soft);color:var(--bad);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px}
.note{background:var(--surface-2);color:var(--fg-2);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px}
.loading{color:var(--fg-3);font-size:12.5px}
/* org chart */
.org{overflow-x:auto;padding-bottom:8px}
.tree,.tree ul{list-style:none;margin:0;padding:0;display:flex;justify-content:center;gap:16px;position:relative}
.tree ul{padding-top:22px}
.tree li{display:flex;flex-direction:column;align-items:center;position:relative;padding-top:22px}
.tree>li{padding-top:0}
.tree li::before{content:"";position:absolute;top:0;left:50%;height:22px;border-left:1.5px solid var(--line)}
.tree>li::before{display:none}
.tree ul>li::after{content:"";position:absolute;top:0;border-top:1.5px solid var(--line);left:0;right:0}
.tree ul>li:first-child::after{left:50%}
.tree ul>li:last-child::after{right:50%}
.tree ul>li:only-child::after{display:none}
.tree ul::before{content:"";position:absolute;top:0;left:50%;height:22px;border-left:1.5px solid var(--line)}
.tree ul{padding-top:44px}
.node{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:176px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.node:hover{border-color:var(--accent)}
.node:focus-visible{outline:2px solid var(--accent)}
.node b{font-size:13px;font-weight:600}
.node span{font-size:11.5px;color:var(--fg-2);line-height:1.35}
.node .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.node.top{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.node.top span{color:var(--on-accent);opacity:.85}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;background:var(--accent-soft);color:var(--accent-strong);flex:none}
/* cards / lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.item-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item-h .grow{flex:1;min-width:0}
.item-h b{font-weight:600}
.rp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 16px}
.rp div{min-width:0}
.rp h4{margin:0 0 2px;font-size:11.5px;color:var(--fg-2);font-weight:600;letter-spacing:.03em}
.rp p{margin:0;white-space:pre-wrap;font-size:13px;overflow-wrap:anywhere}
.kr{display:grid;grid-template-columns:minmax(0,1fr) 120px 110px auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft);font-size:13px}
.kr .bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.kr .bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.kr .num{font-variant-numeric:tabular-nums;color:var(--fg-2);text-align:right;font-size:12.5px}
.ai{white-space:pre-wrap;font-size:13.5px;line-height:1.6;background:var(--surface-2);border-radius:var(--r-sm);padding:14px 16px}
/* forms / dialog */
.overlay{position:fixed;inset:0;background:rgba(10,8,30,.45);display:grid;place-items:center;z-index:40;padding:16px}
.dialog{background:var(--surface);border-radius:16px;width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dialog h2{margin:0;font-size:17px;font-weight:600}
.form{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--fg-2);min-width:0}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hits{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:4px;max-height:180px;overflow:auto}
.hits button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13px}
.hits button:hover,.hits button:focus-visible{background:var(--surface-2)}
.hits img{width:22px;height:22px;border-radius:50%}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--rail);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:60}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding-block:10px;padding-inline:12px;gap:12px;z-index:30;overflow-x:auto}
  .brand b,.brand span,.rail-foot{display:none}
  .nav{flex-direction:row}
  .nav button{padding:8px 10px;white-space:nowrap}
  main{padding-inline:16px}
  .kr{grid-template-columns:minmax(0,1fr) auto}
  .kr .bar,.kr .num{grid-column:1/-1}
  .fstep{grid-template-columns:minmax(90px,120px) minmax(0,1fr) 64px}
  .fconv{padding-left:0}
}
@media (prefers-reduced-motion:no-preference){.fstep .fb i,.pace i,.kr .bar i{transition:width .5s ease}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><img src="__ISOTIPO__" alt=""><div><b>Growth HQ</b><span>Marketing Lapzo</span></div></div>

    <div class="rail-foot">
      <div class="me" id="me"></div>
      <div class="src-list" id="srcs"></div>
    </div>
  </aside>
  <main id="main">
    <div class="topbar">
      <div><h1 id="title">Resumen</h1><p class="sub" id="subtitle"></p></div>
      <div class="controls" id="controls">
        <div class="seg" role="group" aria-label="Periodo" id="ptype">
          <button data-t="week" aria-pressed="false">Semana</button>
          <button data-t="month" aria-pressed="true">Mes</button>
          <button data-t="quarter" aria-pressed="false">Trimestre</button>
        </div>
        <div class="pnav">
          <button class="icon-btn" id="pprev" aria-label="Periodo anterior"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>

          <button class="icon-btn" id="pnext" aria-label="Periodo siguiente"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
        <label class="toggle"><input type="checkbox" id="offline" checked> Excluir importaciones offline</label>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="tip" id="tip" hidden></div>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';

const HS='HubSpot', SM='Supermetrics Marketing Analytics';

const ADV_STAGE=/demo agendad|demo completad|discovery|propuesta|calificad|negociaci|hot deal|cierre|ganado|aprobaci/i;
const WON_STAGE=/ganado/i;
const MANUAL_CH=[{k:'meta',l:'Meta Ads'},{k:'linkedin',l:'LinkedIn Ads'},{k:'eventos',l:'Eventos'},{k:'otros',l:'Otros'}];
const GOAL_KEYS=[{k:'leads',l:'Contactos nuevos'},{k:'opps',l:'Oportunidades calificadas'},{k:'sql',l:'SQL'},{k:'customers',l:'Clientes'},{k:'revenue',l:'Revenue ganado (MXN)'},{k:'budget',l:'Presupuesto de inversión (MXN)'}];
const KR_SOURCES=[{k:'',l:'Manual'},{k:'leads',l:'Contactos nuevos (HubSpot)'},{k:'opps',l:'Oportunidades calificadas (HubSpot)'},{k:'sql',l:'SQL (HubSpot)'},{k:'customers',l:'Clientes (HubSpot)'},{k:'revenue',l:'Revenue ganado (HubSpot)'},{k:'won',l:'Negocios ganados (HubSpot)'}];

/* ---------- dates & periods ---------- */
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
function startOf(t,d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(t==='week'){d.setDate(d.getDate()-((d.getDay()+6)%7))}
  else if(t==='month'){d.setDate(1)}
  else{d.setDate(1);d.setMonth(Math.floor(d.getMonth()/3)*3)}
  return d}
function addP(t,d,n){d=new Date(d);if(t==='week')d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+(t==='month'?n:3*n));return d}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return {y,w}}
function pkey(t,s){if(t==='week'){const {y,w}=isoWeek(s);return y+'-W'+pad(w)}if(t==='month')return s.getFullYear()+'-'+pad(s.getMonth()+1);return s.getFullYear()+'-Q'+(Math.floor(s.getMonth()/3)+1)}
function plabel(t,s,e){if(t==='week'){const {w}=isoWeek(s);return 'Semana '+w+' · '+s.getDate()+' '+MES3[s.getMonth()]+' – '+e.getDate()+' '+MES3[e.getMonth()]}
  if(t==='month'){const m=MES[s.getMonth()];return m[0].toUpperCase()+m.slice(1)+' '+s.getFullYear()}
  return 'Q'+(Math.floor(s.getMonth()/3)+1)+' '+s.getFullYear()}
function shortLabel(t,s){if(t==='week')return s.getDate()+' '+MES3[s.getMonth()];if(t==='month')return MES3[s.getMonth()]+(s.getMonth()===0?' '+String(s.getFullYear()).slice(2):'');return 'Q'+(Math.floor(s.getMonth()/3)+1)+' '+String(s.getFullYear()).slice(2)}
function period(t,anchor){const s=startOf(t,anchor);const e=addP(t,s,1);e.setDate(e.getDate()-1);return {t,s,e,S:ymd(s),E:ymd(e),key:pkey(t,s),label:plabel(t,s,e)}}
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function elapsed(p){const t=today();if(t<p.s)return 0;if(t>p.e)return 1;return ((t-p.s)/864e5+1)/((p.e-p.s)/864e5+1)}
const TREND_N={week:12,month:12,quarter:6};
const GRAN={week:'WEEK',month:'MONTH',quarter:'QUARTER'};
function cur(){return period(S.ptype,S.anchor)}
function prev(p){return period(p.t,addP(p.t,p.s,-1))}
function trendRange(p){const s=addP(p.t,p.s,-(TREND_N[p.t]-1));return {S:ymd(s),E:p.E,s,e:p.e}}
function trendBuckets(p){const out=[];for(let i=TREND_N[p.t]-1;i>=0;i--){const s=addP(p.t,p.s,-i);out.push({key:ymd(s),s,label:shortLabel(p.t,s)})}return out}
function weeksIn(p){const out=[];let s=startOf('week',p.s);while(s<=p.e){out.push(period('week',s));s=addP('week',s,1)}return out}
function quarterOf(d){return period('quarter',d)}

/* ---------- formatting ---------- */
const nf=new Intl.NumberFormat('es-MX');
const nfc=new Intl.NumberFormat('es-MX',{notation:'compact',maximumFractionDigits:1});
const fN=n=>n==null||isNaN(n)?'—':nf.format(Math.round(n));
const fC=n=>n==null||isNaN(n)?'—':nfc.format(n);
const fM=n=>n==null||isNaN(n)||!isFinite(n)?'—':'$'+(Math.abs(n)>=100000?nfc.format(n):nf.format(Math.round(n)));
const fP=(n,d=1)=>n==null||isNaN(n)||!isFinite(n)?'—':(n*100).toFixed(d).replace('.0','')+'%';
const ratio=(a,b)=>b?a/b:null;
function delta(a,b,{invert=false,neutral=false}={}){if(a==null||b==null||!b)return '<span class="chip flat">sin comparativo</span>';
  const d=(a-b)/b;const cls=neutral||Math.abs(d)<.005?'flat':((d>0)!==invert?'up':'down');
  return '<span class="chip '+cls+'">'+(d>0?'+':'')+(d*100).toFixed(Math.abs(d)<.1?1:0)+'%</span>'}
function initials(n){return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}

async function boot(){

  const t=today();t.setDate(t.getDate()-1);S.anchor=t;
  S.excludeOffline=lsGet('offline',true);
  const h=(location.hash||'').slice(1);S.view=VIEWS.some(v=>v.id===h)?h:lsGet('view','resumen');
  wire();render();

  const [db,user,mcp,sample,downloads]=await Promise.all(['db','user','mcp','sample','downloads'].map(n=>c.use(n).catch(()=>null)));
  Object.assign(cap,{db,user,mcp,sample,downloads});

function subscribe(){
  const db=cap.db;
  db.collection('team').onSnapshot(s=>{S.team=s.docs.map(d=>({id:d.id,...d.data()}));resolveRole();render()},dbErr);
  db.collection('okrs').onSnapshot(s=>{S.okrs=s.docs.map(d=>({id:d.id,...d.data()}));render()},dbErr);
  db.collection('reports').onSnapshot(s=>{S.reports=s.docs.map(d=>({id:d.id,...d.data()}));render()},dbErr);
  db.collection('spend').onSnapshot(s=>{S.spend={};s.docs.forEach(d=>S.spend[d.id]=d.data());render()},dbErr);
  db.doc('config/goals').onSnapshot(d=>{S.goals=d.exists?d.data():{};render()},dbErr);
}
function dbErr(e){S.dbError=e&&e.code;render()}
function resolveRole(){

function descendants(id){const out=new Set();const walk=p=>S.team.filter(t=>t.reportsTo===p).forEach(t=>{if(!out.has(t.id)){out.add(t.id);walk(t.id)}});walk(id);return out}
function canSee(memberId){if(S.role==='admin')return true;if(!S.meMember)return false;if(memberId===S.meMember.id)return true;return S.role==='lider'&&descendants(S.meMember.id).has(memberId)}
function canEditMemberThings(memberId){if(S.role==='admin')return true;if(!S.meMember)return false;if(memberId===S.meMember.id)return true;return S.role==='lider'&&descendants(S.meMember.id).has(memberId)}

function setLive(k,v){S.live[k]=v;scheduleRender()}
let rq=0;function scheduleRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
const CACHE={cache:{staleTime:300000,gcTime:3600000}};
async function hs(sql){
  const r=await cap.mcp.callTool(HS,'query_crm_data',{sql,verbosityLevel:'LOW'},CACHE);
  let txt='';const p=r.payload;
  if(p&&typeof p==='object'&&p.results)txt=p.results.map(x=>x.content||'').join('\n');
  else if(typeof p==='string')txt=p;
  else txt=(r.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  if(txt.trim().startsWith('{')){try{const j=JSON.parse(txt);if(j.results)txt=j.results.map(x=>x.content||'').join('\n')}catch(e){}}
  const i=txt.indexOf('Dataset TSV:');
  if(i<0){if(/no (data|results)|0 rows|sin datos/i.test(txt))return [];throw {code:'tool_error',message:txt.slice(0,240)||'Respuesta sin datos'}}
  const lines=txt.slice(i+12).trim().split('\n').filter(Boolean);
  lines.shift();
  return lines.map(l=>l.split('\t').map(cell));
}
function cell(v){v=v.trim();const m=v.match(/^(.*) \(([^()]+)\)$/);if(m)return {label:m[1],id:m[2],v};
  if(v===''||v==='Unassigned'||v==='null')return {v,n:0,id:v};const n=Number(v);return isNaN(n)?{v,id:v,label:v}:{v,n,id:v}}
async function sm(args){
  let r=await cap.mcp.callTool(SM,'data_query',{timezone:TZ,...args},CACHE);
  let p=r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}
  if(!p||p.success===false)throw {code:'tool_error',message:(p&&p.error)||'Supermetrics no respondió'};
  let d=p.data,tries=0;
  while(d&&d.status&&d.status!=='completed'&&tries<4){
    if(d.status==='failed')throw {code:'tool_error',message:'La consulta de Supermetrics falló'};
    r=await cap.mcp.callTool(SM,'get_async_query_results',{schedule_id:d.schedule_id},{cache:false});
    p=r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}
    if(!p||p.success===false)throw {code:'tool_error',message:(p&&p.error)||'Supermetrics no respondió'};
    d=p.data;tries++}
  const rows=(d&&d.data)||[];
  const ids=d.requested_field_ids||[];
  return rows.slice(1).map(row=>{const o={};ids.forEach((k,i)=>o[k]=row[i]);return o});
}
function errMsg(e,server){
  const c=e&&e.code;const n=server||'el conector';
  if(c==='server_not_connected'||c==='selection_required')return 'Conecta '+n+' en claude.ai → Configuración → Conectores para ver esta sección.';
  if(c==='needs_reauth')return 'Reconecta '+n+' en claude.ai → Configuración → Conectores.';
  if(c==='not_in_manifest'||c==='consent_required')return 'No diste permiso a esta página para usar '+n+'. Recarga la página y acepta el permiso.';
  if(c==='blocked_by_policy'||c==='approval_required')return 'La política de tu organización bloquea '+n+' aquí.';
  if(c==='server_unavailable'||c==='upstream_error')return n+' no respondió a tiempo. Cambia de periodo o recarga para reintentar.';
  return (e&&e.message?String(e.message).slice(0,200):'Error desconocido')+'';
}
function run(key,server,fn){
  const g=S.gen;const prevV=S.live[key];
  setLive(key,{st:'load',data:prevV&&prevV.data,server});
  fn().then(data=>{if(g===S.gen)setLive(key,{st:'ok',data,at:Date.now(),server})})
    .catch(e=>{if(g!==S.gen)return;
      const deny=['needs_reauth','server_not_connected','not_in_manifest','blocked_by_policy','approval_required'].includes(e&&e.code);
      if(e&&e.retryable&&!(prevV&&prevV.retried)){setTimeout(()=>{if(g===S.gen)run(key,server,fn)},(e.retryAfterMs||1500)+Math.random()*800);S.live[key]={st:'load',retried:true,server};return}
      setLive(key,{st:'err',err:errMsg(e,server),data:deny?null:prevV&&prevV.data,server})});
}
function loadLive(){
  if(!cap.mcp)return;
  S.gen++;
  const p=cur(),pp=prev(p),tr=trendRange(p),G=GRAN[p.t];
  const q=quarterOf(p.s);
  const bt=(a,b)=>"BETWEEN '"+a+"' AND '"+b+"'";
  run('src',HS,()=>hs("SELECT hs_analytics_source, lifecyclestage, COUNT(*) FROM CONTACT WHERE createdate "+bt(p.S,p.E)+" GROUP BY hs_analytics_source, lifecyclestage"));
  run('srcPrev',HS,()=>hs("SELECT hs_analytics_source, lifecyclestage, COUNT(*) FROM CONTACT WHERE createdate "+bt(pp.S,pp.E)+" GROUP BY hs_analytics_source, lifecyclestage"));
  run('trend',HS,()=>hs("SELECT DATE_TRUNC(createdate, '"+G+"'), hs_analytics_source, lifecyclestage, COUNT(*) FROM CONTACT WHERE createdate "+bt(tr.S,tr.E)+" GROUP BY DATE_TRUNC(createdate, '"+G+"'), hs_analytics_source, lifecyclestage"));
  run('deals',HS,()=>hs("SELECT pipeline, COUNT(*), SUM(amount_in_home_currency) FROM DEAL WHERE createdate "+bt(p.S,p.E)+" GROUP BY pipeline"));
  run('won',HS,()=>hs("SELECT pipeline, COUNT(*), SUM(amount_in_home_currency) FROM DEAL WHERE closedate "+bt(p.S,p.E)+" AND hs_is_closed_won = 'true' GROUP BY pipeline"));
  run('wonPrev',HS,()=>hs("SELECT pipeline, COUNT(*), SUM(amount_in_home_currency) FROM DEAL WHERE closedate "+bt(pp.S,pp.E)+" AND hs_is_closed_won = 'true' GROUP BY pipeline"));
  run('wonTrend',HS,()=>hs("SELECT DATE_TRUNC(closedate, '"+G+"'), COUNT(*), SUM(amount_in_home_currency) FROM DEAL WHERE closedate "+bt(tr.S,tr.E)+" AND hs_is_closed_won = 'true' GROUP BY DATE_TRUNC(closedate, '"+G+"')"));
  run('owners',HS,()=>hs("SELECT hubspot_owner_id, dealstage, COUNT(*) FROM DEAL WHERE createdate "+bt(p.S,p.E)+" GROUP BY hubspot_owner_id, dealstage"));
  run('qSrc',HS,()=>hs("SELECT hs_analytics_source, lifecyclestage, COUNT(*) FROM CONTACT WHERE createdate "+bt(q.S,q.E)+" GROUP BY hs_analytics_source, lifecyclestage"));
  run('qWon',HS,()=>hs("SELECT pipeline, COUNT(*), SUM(amount_in_home_currency) FROM DEAL WHERE closedate "+bt(q.S,q.E)+" AND hs_is_closed_won = 'true' GROUP BY pipeline"));
  const aw=(s,e,fields)=>sm({ds_id:'AW',ds_accounts:AW_ACC,fields,date_range_type:'custom',start_date:s,end_date:e});
  run('aw',SM,()=>aw(p.S,p.E,'Currencycode,cost,impressions,clicks,conversions'));
  run('awPrev',SM,()=>aw(pp.S,pp.E,'cost,impressions,clicks,conversions'));
  run('awTrend',SM,()=>aw(tr.S,tr.E,'date,cost,clicks,conversions'));
  run('awCamp',SM,()=>aw(p.S,p.E,'Campaignname,cost,clicks,conversions'));
  run('qAw',SM,()=>aw(q.S,q.E,'cost'));
  const ga=(s,e)=>sm({ds_id:'GAWA',ds_accounts:GA_ACC,fields:'sessionDefaultChannelGroup,sessions,totalUsers,keyEvents',date_range_type:'custom',start_date:s,end_date:e});
  run('ga',SM,()=>ga(p.S,p.E));
  run('gaPrev',SM,()=>ga(pp.S,pp.E));
}
const L=k=>S.live[k]||{st:'idle'};
const D=k=>(S.live[k]&&S.live[k].data)||null;

/* ---------- derived metrics ---------- */
function funnelFrom(rows){
  if(!rows)return null;
  const counts=[0,0,0,0,0];const bySrc={};
  rows.forEach(r=>{const src=r[0].id,st=r[1].id,n=r[2].n||0;
    if(S.excludeOffline&&src==='OFFLINE')return;
    const rk=RANK[st]==null?0:RANK[st];
    for(let i=0;i<=rk;i++)counts[i]+=n;
    const b=bySrc[src]||(bySrc[src]={id:src,label:SOURCES[src]||r[0].label||src,c:[0,0,0,0,0]});
    for(let i=0;i<=rk;i++)b.c[i]+=n});
  return {counts,bySrc:Object.values(bySrc)};
}
function wonFrom(rows){if(!rows)return null;let n=0,amt=0;const by=[];rows.forEach(r=>{const c=r[1].n||0,a=r[2].n||0;n+=c;amt+=a;if(c)by.push({label:r[0].label||r[0].v,n:c,amt:a})});return {n,amt,by:by.sort((a,b)=>b.amt-a.amt)}}
function awTot(rows){if(!rows)return null;const t={cost:0,impressions:0,clicks:0,conversions:0,cur:''};rows.forEach(r=>{t.cost+=+r.cost||0;t.impressions+=+r.impressions||0;t.clicks+=+r.clicks||0;t.conversions+=+r.conversions||0;if(r.Currencycode)t.cur=r.Currencycode});return t}
function manualSpend(p){
  // manual spend is captured per month; weeks are prorated by days
  let tot=0;const by={};MANUAL_CH.forEach(c=>by[c.k]=0);
  let d=new Date(p.s);
  while(d<=p.e){const mk=d.getFullYear()+'-'+pad(d.getMonth()+1);const doc=S.spend[mk];
    if(doc){const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();MANUAL_CH.forEach(c=>{const v=(+doc[c.k]||0)/dim;by[c.k]+=v;tot+=v})}
    d.setDate(d.getDate()+1)}
  return {tot,by};
}
function goalFor(p,k){const q=quarterOf(p.s);const g=S.goals[q.key];if(!g||g[k]==null||g[k]==='')return null;const v=+g[k];
  if(p.t==='quarter')return v;if(p.t==='month')return v/3;return v*7/((q.e-q.s)/864e5+1)}
function metrics(){
  const f=funnelFrom(D('src')),fp=funnelFrom(D('srcPrev'));
  const w=wonFrom(D('won')),wp=wonFrom(D('wonPrev'));
  const a=awTot(D('aw')),ap=awTot(D('awPrev'));
  const p=cur(),pp=prev(p);const ms=manualSpend(p),msp=manualSpend(pp);
  const spend=(a?a.cost:0)+ms.tot,spendP=(ap?ap.cost:0)+msp.tot;
  return {f,fp,w,wp,a,ap,ms,msp,spend:a||ms.tot?spend:null,spendP:ap||msp.tot?spendP:null,p,pp};
}

/* ---------- rendering helpers ---------- */
function status(k,server){const l=L(k);if(l.st==='err')return '<div class="err">'+esc(l.err)+'</div>';return ''}

  if(!l.data&&(l.st==='load'||l.st==='idle'))return '<div class="loading">Cargando datos…</div>';

function stamp(keys){const ls=keys.map(L);if(ls.some(l=>l.st==='load'))return '<span class="meta">Actualizando…</span>';const at=Math.max(...ls.map(l=>l.at||0));return at?'<span class="meta">Actualizado '+new Date(at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})+'</span>':''}
function kpi(lbl,val,deltaHtml,extra){return '<div class="kpi"><span class="lbl">'+esc(lbl)+'</span><span class="val">'+val+'</span><div class="row">'+(deltaHtml||'')+(extra||'')+'</div></div>'}
function paceBar(actual,goal,p){if(goal==null||actual==null)return '';const pct=Math.min(1,actual/goal);const exp=elapsed(p);
  const st=actual>=goal*exp*0.95?'ok':actual>=goal*exp*0.75?'warn':'bad';
  return '<div style="width:100%"><div class="pace" title="Esperado a la fecha: '+fP(exp,0)+'"><i style="width:'+(pct*100)+'%"></i><u style="left:calc('+(exp*100)+'% - 1px)"></u></div><div class="row" style="margin-top:4px"><span class="chip '+st+'">'+fP(actual/goal,0)+' de meta</span><span>meta '+fC(goal)+'</span></div></div>'}

let chartId=0;
function bars(points,{fmt=fN,h=150,dimLast=false}={}){
  // points: [{label, value, tip}]
  const W=560,H=h,pl=44,pr=6,pt=8,pb=22;const id='c'+(++chartId);
  const max=Math.max(1,...points.map(p=>p.value||0));
  const step=niceStep(max/3);const top=Math.ceil(max/step)*step;
  const n=points.length;const bw=(W-pl-pr)/n;const barW=Math.max(4,Math.min(28,bw*0.62));
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g='';for(let v=0;v<=top+1e-9;v+=step){g+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(pl-6)+'" y="'+(y(v)+3.5)+'" text-anchor="end">'+esc(fC(v))+'</text>'}
  const every=n>8?2:1;
  let b='';points.forEach((p,i)=>{const x=pl+bw*i+(bw-barW)/2;const v=p.value||0;const yy=y(v);const hh=Math.max(0,H-pb-yy);
    const r=Math.min(4,barW/2,hh);
    const path=hh>0?'M'+x+','+(H-pb)+'V'+(yy+r)+'q0,-'+r+' '+r+',-'+r+'H'+(x+barW-r)+'q'+r+',0 '+r+','+r+'V'+(H-pb)+'Z':'';

function krCurrent(kr,q){
  if(!kr.source)return +kr.current||0;
  const f=funnelFrom(D('qSrc')),w=wonFrom(D('qWon')),aw=D('qAw');
  if(kr.source==='leads')return f?f.counts[0]:null;
  if(kr.source==='opps')return f?f.counts[2]:null;
  if(kr.source==='sql')return f?f.counts[3]:null;
  if(kr.source==='customers')return f?f.counts[4]:null;
  if(kr.source==='revenue')return w?w.amt:null;
  if(kr.source==='won')return w?w.n:null;
  return null}
function krProgress(kr,q){const c=krCurrent(kr,q);const s=+kr.start||0,t=+kr.target||0;if(c==null||t===s)return null;return Math.max(0,Math.min(1.2,(c-s)/(t-s)))}

  const exp=elapsed(q);const st=prog>=exp*0.9?['ok','En camino']:prog>=exp*0.65?['warn','En riesgo']:['bad','Atrasado'];

  h+=krs.map((k,i)=>{const pr=krProgress(k,q);const c=krCurrent(k,q);const ko=member(k.ownerId);
    const mayUpdate=!k.source&&(canEd||(S.meMember&&k.ownerId===S.meMember.id));

  async fd=>{const out=[];for(let i=0;i<5;i++){const t=(fd.get('kt'+i)||'').trim();if(!t)continue;out.push({title:t,source:fd.get('ks'+i)||'',ownerId:fd.get('ko'+i)||null,start:+fd.get('ka'+i)||0,target:+fd.get('kb'+i)||0,current:+fd.get('kc'+i)||0,unit:(fd.get('ku'+i)||'').trim()})}
    const data={quarter:o.quarter,objective:fd.get('objective').trim(),ownerId:fd.get('ownerId')||null,area:fd.get('area').trim(),krs:out,order:o.order||S.okrs.length+1,updatedAt:new Date().toISOString()};
    if(id)await cap.db.doc('okrs/'+id).set(data);else await cap.db.collection('okrs').add(data);toast('Objetivo guardado')},
  f=>{const del=f.querySelector('#o-del');if(del)del.addEventListener('click',async()=>{if(del.dataset.armed){await cap.db.doc('okrs/'+id).delete();closeModal();toast('Objetivo borrado')}else{del.dataset.armed='1';del.textContent='Confirmar borrar'}})});
}
function formKr(id,i){
  const o=S.okrs.find(x=>x.id===id);const k=o.krs[i];
  openModal('<h2>Actualizar avance</h2><p class="meta">'+esc(k.title)+'</p><div class="form">'+fld('Valor actual ('+esc(k.unit||'')+' meta '+esc(k.target)+')','<input type="number" step="any" id="kr-c" name="current" value="'+esc(k.current||0)+'" required>')+'</div>'+acts(),
  async fd=>{const krs=o.krs.map((x,j)=>j===i?{...x,current:+fd.get('current')||0}:x);await cap.db.doc('okrs/'+id).update({krs,updatedAt:new Date().toISOString()});toast('Avance actualizado')});
}
function formGoals(){
  const q=quarterOf(cur().s);const g=S.goals[q.key]||{};
  openModal('<h2>Metas de '+esc(q.label)+'</h2><p class="meta">Metas trimestrales. Las vistas de mes y semana las reparten de forma proporcional.</p><div class="form"><div class="f2">'+
    GOAL_KEYS.map(x=>fld(x.l,'<input type="number" step="any" id="g-'+x.k+'" name="'+x.k+'" value="'+esc(g[x.k]!=null?g[x.k]:'')+'">')).join('')+'</div></div>'+acts(),
  async fd=>{const v={};GOAL_KEYS.forEach(x=>{const s=fd.get(x.k);if(s!=='')v[x.k]=+s});const all={...S.goals,[q.key]:v};await cap.db.doc('config/goals').set(all);toast('Metas guardadas')});
}
function formSpend(k){
  const doc=S.spend[k]||{};const [y,m]=k.split('-');
  openModal('<h2>Inversión de '+MES[+m-1]+' '+y+'</h2><p class="meta">Montos en MXN para canales sin conexión en vivo. Google Ads ya se suma automáticamente.</p><div class="form"><div class="f2">'+
    MANUAL_CH.map(c=>fld(c.l,'<input type="number" step="any" id="s-'+c.k+'" name="'+c.k+'" value="'+esc(doc[c.k]!=null?doc[c.k]:'')+'">')).join('')+'</div></div>'+acts(),
  async fd=>{const v={month:k,updatedAt:new Date().toISOString()};MANUAL_CH.forEach(c=>{const s=fd.get(c.k);if(s!=='')v[c.k]=+s});await cap.db.doc('spend/'+k).set(v);toast('Inversión guardada')});
}

/* ---------- shell ---------- */
function wire(){
  $('#nav').innerHTML=VIEWS.map(v=>'<button data-v="'+v.id+'"><svg viewBox="0 0 24 24">'+v.ico+'</svg>'+v.l+'</button>').join('');
  $('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;S.view=b.dataset.v;lsSet('view',S.view);try{history.replaceState(null,'','#'+S.view)}catch(_){}render();window.scrollTo(0,0)});
  $('#ptype').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b||b.dataset.t===S.ptype)return;S.ptype=b.dataset.t;lsSet('ptype',S.ptype);loadLive();render()});
  $('#pprev').addEventListener('click',()=>{S.anchor=addP(S.ptype,startOf(S.ptype,S.anchor),-1);loadLive();render()});
  $('#pnext').addEventListener('click',()=>{S.anchor=addP(S.ptype,startOf(S.ptype,S.anchor),1);loadLive();render()});
  $('#offline').addEventListener('change',e=>{S.excludeOffline=e.target.checked;lsSet('offline',S.excludeOffline);render()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  $('#view').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
    if(!cap.db&&a!=='ai'&&a!=='dl'){toast('Abre la página en claude.ai para editar.');return}
    if(a==='member')formMember(b.dataset.id);
    else if(a==='report')formReport(b.dataset.w,b.dataset.m);
    else if(a==='okr')formOkr(b.dataset.id);
    else if(a==='kr')formKr(b.dataset.id,+b.dataset.i);
    else if(a==='goals')formGoals();
    else if(a==='spend')formSpend(b.dataset.k);
    else if(a==='ai')genAI();
    else if(a==='dl')download()});
}
const SUBS={resumen:'El negocio de marketing en una vista',funnel:'De contacto a cliente, con conversión por etapa',canales:'Paid, orgánico y web: inversión, tráfico y calidad',reportes:'Semanales del equipo y consolidado mensual y trimestral',okrs:'Objetivos y resultados clave del trimestre',equipo:'Estructura, accesos y desempeño comercial'};
function render(){
  const p=cur();
  document.querySelectorAll('#nav [data-v]').forEach(b=>b.setAttribute('aria-current',b.dataset.v===S.view?'page':'false'));
  document.querySelectorAll('#ptype [data-t]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===S.ptype)));
  $('#plabel').textContent=p.label;$('#offline').checked=S.excludeOffline;
  const v=VIEWS.find(x=>x.id===S.view);$('#title').textContent=v.l;$('#subtitle').textContent=SUBS[S.view];
  // rail foot
  const me=S.meMember;$('#me').innerHTML='<span class="avatar">'+esc(initials(me?me.name:'?'))+'</span><div><b>'+esc(me?me.name:(S.uid?'Tu cuenta':'Invitado'))+'</b>'+ROLE_L[S.role]+'</div>';
  const grp=(keys)=>{const ls=keys.map(L);if(ls.some(l=>l.st==='err'))return 'err';if(ls.some(l=>l.st==='load'))return 'load';if(ls.some(l=>l.st==='ok'))return 'ok';return ''};
  $('#srcs').innerHTML=[['HubSpot',['src','deals','won','trend']],['Google Ads',['aw','awTrend']],['GA4',['ga']],['Equipo y OKRs',null]].map(([n,k])=>'<span class="src"><i class="dot '+(k?grp(k):(cap.db?'ok':''))+'"></i>'+n+'</span>').join('');
  let html='';
  if(S.dbError==='revoked')html+='<div class="err">Perdiste el acceso a los datos de esta página. Recarga para continuar.</div>';
  const fn={resumen:vResumen,funnel:vFunnel,canales:vCanales,reportes:vReportes,okrs:vOkrs,equipo:vEquipo}[S.view];
  html+=fn();
  const view=$('#view');
  const sy=window.scrollY;view.innerHTML='<div class="grid" style="gap:16px">'+html+'</div>';window.scrollTo(0,sy);
}
boot();
})();
</script>
